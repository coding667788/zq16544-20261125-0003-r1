[project]
name = "folioimpact"
version = "1.0.0"
description = "Offline possible-world archival segment bounds and mitigation search"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
folioimpact = "folioimpact.cli:main"

[tool.setuptools]
packages = ["folioimpact"]
